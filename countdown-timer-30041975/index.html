<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to Victory Day </title>

  <link rel="stylesheet" href="assets/styles/style.css">
  <link rel="stylesheet" href="assets/styles/animate.css">
</head>

<body>
  <div id="container" class="container">
    <h1 id="headline">COUNTDOWN TO Victory Day <span id="showYear"></span></h1>
    <div id="countdown">
      <ul class="timer-wrap">
        <li><span id="days" class="number"></span>Days</li>
        <li><span id="hours" class="number"></span>Hours</li>
        <li><span id="minutes" class="number"></span>Minutes</li>
        <li><span id="seconds" class="number"></span>Seconds</li>
      </ul>
    </div>
    <div id="content" class="emoji">
      <img src="assets/icons/tank.svg" class="tank"/>
      <img src="assets/icons/gate.svg" class="gate"/>
    </div>
  </div>
</body>

<script src="assets/scripts/main.js"></script>

</html>
